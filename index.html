<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Open Reader</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1 id="title">Open Reader</h1>
  <button class="g" id="zo" style="display:none">A−</button>
  <button class="g" id="zi" style="display:none">A+</button>
  <button class="g" id="th">◐</button>
  <label class="btn" for="f">Open</label>
  <input id="f" type="file" hidden>
</header>

<div id="home">
  <h2 style="margin:0 0 4px">Open Reader</h2>
  <p style="color:var(--mu);margin:0 0 22px">Read any document. No ads, no uploads, no tracking.</p>
  <div id="drop">
    <button onclick="document.getElementById('f').click()">Choose a file</button>
    <p>or drop one here</p>
  </div>
  <div class="fm">
    <span>PDF</span><span>DOCX / DOC</span><span>XLSX / XLS / CSV</span><span>PPTX / PPT</span><span>EPUB</span><span>TXT / MD</span><span>HTML</span><span>JSON / XML / code</span><span>Images</span>
  </div>
  <p class="note">Files are opened on your device only; nothing leaves your phone.</p>
</div>

<div id="view"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="js/legacy.js"></script>
<script src="js/app.js"></script>
</body>
</html>
